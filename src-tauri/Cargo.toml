[package]
name = "hush"
version = "0.12.3"
description = "Quietly unsubscribe from bulk email"
authors = ["Hush contributors"]
license = "MIT"
repository = "https://github.com/justlinuxnoob/hush"
edition = "2021"
rust-version = "1.82"

[lib]
# Tauri v2 keeps the app in a library so mobile targets and integration tests can
# both link against it. `_lib` avoids a name clash with the binary on Windows.
name = "hush_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

url = "2"
percent-encoding = "2"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
log = { version = "0.4", features = ["std"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-single-instance = "2.4.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
wiremock = "0.6.5"

[features]
# Tauri's default CSP/devtools wiring; `custom-protocol` is set by `tauri build`.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
incremental = false

name: Release

# Releases are built here, on GitHub's runners, from a tag in this repository —
# never on a maintainer's machine. That is a trust claim the project makes in
# the README, so this workflow is part of the product.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Strip absolute paths out of the binary so two machines building the same
  # commit get closer to the same bytes.
  RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/build"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal macOS build rather than one per architecture: the
          # resulting .dmg runs natively on both Apple silicon and Intel, and it
          # avoids depending on macos-13 runners, which are scarce enough to
          # queue for half an hour and are being retired.
          - name: macOS (universal)
            os: macos-14
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
          - name: Windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: System libraries (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      # Added explicitly rather than through the action's `targets` input. The
      # toolchain is pinned by rust-toolchain.toml, so the targets have to land
      # on *that* toolchain — the action installed them elsewhere, and the
      # universal build failed at the last step with only aarch64 present.
      - name: Install the targets this build needs
        shell: bash
        run: rustup target add ${{ matrix.rust-targets }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `ci`, not `install`: the lockfile decides, and a drifted lockfile fails
      # the build rather than silently changing what ships.
      - run: npm ci

      - name: Build
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          root="src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$root" -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) \
            -exec cp {} out/ \;
          ls -la out

      - name: Checksums
        shell: bash
        working-directory: out
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum * > "SHA256SUMS-${{ matrix.target }}.txt"
          else
            shasum -a 256 * > "SHA256SUMS-${{ matrix.target }}.txt"
          fi
          cat "SHA256SUMS-${{ matrix.target }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: hush-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: One checksum file for the whole release
        working-directory: artifacts
        run: |
          cat SHA256SUMS-*.txt | sort -k2 > SHA256SUMS
          rm -f SHA256SUMS-*.txt
          echo "### Checksums" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true
          body: |
            ## Verifying this download

            Every file here was built by [this workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            on GitHub's runners, from tag `${{ github.ref_name }}`. Nothing was
            built on a maintainer's machine.

            Check what you downloaded against `SHA256SUMS`:

            ```sh
            shasum -a 256 -c SHA256SUMS --ignore-missing
            ```

            ## macOS

            These builds are **not signed or notarised**. macOS will refuse to
            open them by double-click. Right-click the app, choose **Open**, then
            **Open** again. Full instructions are in the README.

            ## A reminder

            Dry run is switched on the first time you launch Hush. Nothing is
            sent until you turn it off.
